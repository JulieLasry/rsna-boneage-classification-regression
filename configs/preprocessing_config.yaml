task: classification        # classification | regression

data:
  base_dir: data/raw
  output_dir: data/processed
  img_size: 224

split:
  seed: 42
  test_size: 0.2
  n_folds: 5

augmentation:               # just on the train set
  horizontal_flip: 0.5      # probability
  rotation: [-15.0, 15.0]   # degrees
  translation: [-0.1, 0.1]  # image size fraction
  scaling: [0.8, 1.2]
  shear: [-5.0, 5.0]        # degrees
  gaussian_noise: [0.1, 0.3]
  brightness: [-0.3, 0.3]
  contrast: [-0.3, 0.3]

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
